name: Validate website
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate client JavaScript
        run: node --check assets/app.js
      - name: Check required static files
        run: |
          test -f index.html
          test -f contact.html
          test -f __forms.html
          test -f netlify.toml
          test -f assets/style.css
          test -f sitemap.xml
