name: Validate website
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate client JavaScript
        run: |
          node --check assets/app.js
          node --check assets/scroll-journey.js
      - name: Validate Hostinger PHP contact handler
        run: php -l contact.php
      - name: Check required static files
        run: |
          test -f index.html
          test -f contact.html
          test -f __forms.html
          test -f netlify.toml
          test -f assets/style.css
          test -f assets/scroll-journey.css
          test -f contact.php
          test -f HOSTINGER_DEPLOY.md
          test -f sitemap.xml
